; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = mainboard_esp32

[env:prototype_esp32]
platform = espressif32 @ 6.5.0 ; espidf 5.1.2
framework = espidf
board = featheresp32
monitor_speed = 115200
monitor_raw = yes 
build_flags =
    -DHARDWARE_PROTOTYPE
build_src_filter =                ; para excluir src
    +<*>
    -<ultrasonic.c>
lib_ignore = CAN_MCB        ; para excluir componentes componentes

[env:mainboard_esp32]
platform = espressif32 @ 6.5.0 ; espidf 5.1.2
framework = espidf
board = featheresp32
monitor_speed = 115200
monitor_raw = yes 
build_flags =
    -DHARDWARE_MAINBOARD
build_src_filter =
    +<*>
    -<stepper.c>
lib_ignore = IMC_CONTROL

[env:splitboard_esp32]
platform = espressif32 @ 6.5.0 ; espidf 5.1.2
framework = espidf
board = featheresp32
monitor_speed = 115200
monitor_raw = yes 
build_flags =
    -DHARDWARE_SPLITBOARD
build_src_filter =
    +<*>
    -<stepper.c>


[env:esp32-s3]
platform = espressif32 @6.5.0 ; @6.8.1
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_singleapp.csv
; board_build.partitions = no_ota.csv
; board_build.partitions = huge_app.csv
monitor_raw = yes 